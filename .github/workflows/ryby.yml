name: Obrázky ryb (jednorázově)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/ryby-obrazky.mjs"]
permissions:
  contents: write
jobs:
  ryby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/ryby-obrazky.mjs
      - run: |
          git config user.name "Pstruh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging && git commit -m "Kandidátní obrázky ryb" && git pull --rebase && git push || true
