name: Diagnostika Pšovka (jednorázově)
on:
  push:
    branches: [main]
    paths: ["scripts/diag-psovka.mjs"]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/diag-psovka.mjs
      - run: |
          git config user.name "Pstruh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b staging-diag
          git add staging && git commit -m "diag" && git push -f origin staging-diag
