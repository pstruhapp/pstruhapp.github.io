name: Blochovy tabule (jednorázově)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/bloch.mjs","scripts/bloch-extra.txt"]
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/bloch.mjs
      - run: |
          git config user.name "Pstruh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b staging-ryby2
          git add staging && git commit -m "Blochovy tabule" && git push -f origin staging-ryby2
